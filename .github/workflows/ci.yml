name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch / PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build, E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recepita
          POSTGRES_PASSWORD: recepita
          POSTGRES_DB: recepita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recepita -d recepita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway service database; the tests require "test" in its name.
      DATABASE_URL: postgresql://recepita:recepita@localhost:5432/recepita_test
      # Dummy values for CI only (no real secrets are needed by any step).
      JWT_SECRET: ci-only-dummy-jwt-secret-not-used-anywhere-else
      APP_URL: http://localhost:4450
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint (Biome)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npx next build

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
